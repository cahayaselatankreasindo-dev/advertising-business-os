name: CSK Release Package (TEST ONLY)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/csk-inventory-bridge-fix-20261124
    paths:
      - "**"
      - ".github/workflows/csk-release-package.yml"

permissions:
  contents: read

jobs:
  package:
    name: Validate and build TEST-only package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run release preflight and create ZIP
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "csk-release"
          ./tools/csk-release-preflight.ps1 -OutputDirectory $output

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: csk-business-os-development-package
          path: ${{ runner.temp }}/csk-release/*.zip
          if-no-files-found: error
          retention-days: 14
