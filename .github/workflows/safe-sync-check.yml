name: Check Business OS safe sync
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hpp-calculator.js'
      - 'hpp-ui.js'
      - 'hpp-calculator.test.js'
      - 'email-marketing.js'
      - 'email-marketing-ui.js'
      - 'email-marketing.test.js'
      - 'persona-leads.js'
      - 'persona-leads.test.js'
      - 'operations-core.js'
      - 'operations-ui.js'
      - 'operations.test.js'
      - 'preview/CSK-Email-Marketing-Offline.html'
      - 'sync-safe.js'
      - 'sync-safe.test.js'
      - 'sync-backend-integration.test.js'
      - 'apps-script/LabSelfTest.gs'
      - 'apps-script/LabRequestGuard.gs'
      - 'sw.js'
      - 'mapping.test.js'
      - 'preview/CSK-Business-OS-Brand-Preview.html'
      - 'preview/brand-preview.test.js'
      - 'manifest.json'
      - '.github/workflows/safe-sync-check.yml'
  workflow_dispatch:
jobs:
  safe-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check sync-safe.js
          node --check sync-safe.test.js
          node sync-safe.test.js
          node sync-backend-integration.test.js
      - name: Verify standalone brand preview (no cloud access)
        run: node preview/brand-preview.test.js
      - name: Test HPP costing, quote policy, and local-only integration
        run: |
          node --check hpp-calculator.js
          node --check hpp-ui.js
          node hpp-calculator.test.js
      - name: Test Email Marketing safety and segmentation
        run: |
          node --check email-marketing.js
          node --check email-marketing-ui.js
          node email-marketing.test.js
      - name: Test B2B persona reference (no CRM writes)
        run: |
          node --check persona-leads.js
          node persona-leads.test.js
      - name: Test local Operations Suite and financial guardrails
        run: |
          node --check operations-core.js
          node --check operations-ui.js
          node operations.test.js
      - name: Validate existing sheet mapping
        run: node mapping.test.js
