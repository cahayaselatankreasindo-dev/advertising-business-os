name: CSK Security Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/csk-pin-rbac-hardening
      - feature/commercial-documents-standalone-20261109
      - feature/hpp-material-conversion-20261120
      - feature/csk-colorful-ui-20261124
      - feature/csk-inventory-bridge-fix-20261124
      - feature/csk-stock-reservation-core-20261125
      - feature/csk-operational-completion-20261125
      - feature/csk-hpp-quotation-validation-20261125
  pull_request:
    branches:
      - main
      - feature/csk-colorful-ui-20261124
      - feature/csk-inventory-bridge-fix-20261124
      - feature/csk-stock-reservation-core-20261125

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check google_apps_script.js
          node -e "new Function(require('fs').readFileSync('apps-script/Code.gs','utf8'))"
          node --check security/guard.js
          node --check commercial-documents.js
          node --check csk-pdf.js
          node --check csk-pdf.test.cjs
          node --check catalog-seed.test.cjs
          node --check catalog-manager.js
          node --check catalog-manager.test.cjs
          node --check custom-costing-engine.js
          node --check custom-costing.js
          node --check custom-costing-engine.test.cjs
          node --check custom-costing-integration.test.cjs
          node --check sales-order-engine.js
          node --check sales-orders.js
          node --check sales-order-workflow.test.cjs
          node --check sales-order-backend.test.cjs
          node --check inventory-engine.js
          node --check inventory.js
          node --check material-master.js
          node --check material-master.test.cjs
          node --check hpp-workflow.test.cjs
          node --check security/guard.js
          node --check inventory-workflow.test.cjs
          node --check inventory-backend.test.cjs
          node --check commercial-documents.test.cjs
          node --check commercial-workflow.test.cjs
          node --check mapping.test.js
          node --check backend-auth.test.cjs
          node --check finance-integrity.test.cjs
          node --check crm-upgrade.js
          node --check crm-upgrade.test.cjs
          node --check deal-conversion.test.cjs
          node --check csk-visual-refresh.test.cjs
          node --check csk-ui-components.test.cjs
          node --check pwa-assets.test.cjs
          node --check dashboard.test.cjs
          node --check end-to-end-commercial-operations.test.cjs
      - name: Mapping and RBAC integration tests
        run: node mapping.test.js
      - name: Commercial Document Center tests
        run: |
          node commercial-documents.test.cjs
          node csk-pdf.test.cjs
          node catalog-seed.test.cjs
          node catalog-manager.test.cjs
          node custom-costing-engine.test.cjs
          node custom-costing-integration.test.cjs
          node sales-order-workflow.test.cjs
          node sales-order-backend.test.cjs
          node inventory-workflow.test.cjs
          node inventory-backend.test.cjs
          node material-master.test.cjs
          node hpp-workflow.test.cjs
      - name: Commercial workflow simulation
        run: node commercial-workflow.test.cjs
      - name: End-to-end production and inventory operations
        run: node end-to-end-commercial-operations.test.cjs
      - name: Backend security policy tests
        run: node backend-auth.test.cjs
      - name: Dashboard prioritisation and status tests
        run: node dashboard.test.cjs
      - name: CRM follow-up and project monitoring tests
        run: node crm-upgrade.test.cjs
      - name: Deal Won idempotency and cash accounting tests
        run: node deal-conversion.test.cjs
      - name: Invoice calculations and sync transport tests
        run: |
          node invoice.test.cjs
          node sync.test.cjs
      - name: Invoice payment ledger integrity tests
        run: node invoice-integrity.test.cjs
      - name: Finance manual-entry and payment-ledger integrity tests
        run: node finance-integrity.test.cjs
      - name: Photo LAB private-access regression tests
        run: node photo-lab.test.cjs
      - name: PWA asset cache integrity tests
        run: node pwa-assets.test.cjs
      - name: CSK colorful UI visual-system tests
        run: node csk-visual-refresh.test.cjs
      - name: CSK shared UI component tests
        run: node csk-ui-components.test.cjs
