name: CSK business source regression checks
on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - 'index.html'
      - 'README.md'
      - 'crm-upgrade.js'
      - 'crm-upgrade.test.cjs'
      - 'deal-conversion.test.cjs'
      - 'sw.js'
      - 'apps-script/Code.gs'
      - 'google_apps_script.js'
      - 'backend-auth.test.cjs'
      - 'mapping.test.js'
      - 'photo-lab/**'
      - 'photo-lab.test.cjs'
      - 'invoice.test.cjs'
      - 'sync.test.cjs'
      - '.github/workflows/photo-lab-check.yml'
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend API authentication contract
        run: node backend-auth.test.cjs
      - name: Validate Apps Script field mapping and migration safety
        run: node mapping.test.js
      - name: Validate Photo LAB source and private access contract
        run: node photo-lab.test.cjs
      - name: Validate quotation, DP and settlement calculations
        run: node invoice.test.cjs
      - name: Validate Apps Script POST transport
        run: node sync.test.cjs
      - name: Validate Deal Won conversion idempotency and cash accounting
        run: |
          node --check google_apps_script.js
          node deal-conversion.test.cjs
      - name: Validate CRM follow-up and project monitoring
        run: |
          node --check crm-upgrade.js
          node crm-upgrade.test.cjs
